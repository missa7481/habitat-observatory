<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Habitat Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,400&family=Source+Sans+3:ital,wght@0,300..700;1,400&family=Barlow:wght@300;400;500;600&display=swap">
<style>
/* Layout: the map is the page. A floating masthead with mode pills, a story rail on the left that moves
   the map chapter by chapter, legend and map key cards at the lower right, and sheets that slide over
   the map for the benchmark and the model notes. Paper, ink, navy and gold; serif display, hairline rules.
   One deliberate light theme, as in a printed atlas. */
:root{
  --bg:#ECE9E1; --card:#FBFAF6; --paper:#F7F5EF; --paper-2:#F1EEE6;
  --ink:#1B1F27; --ink-2:#474D59; --ink-3:#7D828C;
  --rule:rgba(27,31,39,.13); --rule-2:rgba(27,31,39,.07);
  --navy:#012169; --navy-l:#C9D3E3; --gold:#F2A900; --gold-t:#A87400; --gold-l:#FBE7B0;
  --terra:#B5432C; --green:#2E6B3A; --sea:#AFC3CF;
  --serif:'Newsreader','Sitka Text',Georgia,serif;
  --sans:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --num:'Barlow','Bahnschrift','Source Sans 3',sans-serif;
  --shadow:0 1px 1px rgba(27,31,39,.04),0 14px 34px -14px rgba(27,31,39,.22);
  --ease:cubic-bezier(.22,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--gold-t);outline-offset:2px}
i.sp{font-style:italic}

/* map */
#map{position:fixed;inset:0;background:var(--sea);z-index:1}
.leaflet-container{background:var(--sea);font:inherit;outline:none}
.leaflet-control-container{display:none}
.grat{stroke:rgba(27,31,39,.18);stroke-width:.7}
.grat.eq{stroke:rgba(27,31,39,.35);stroke-dasharray:none}
.grat.trop{stroke-dasharray:3 4}
.pix-crisp{image-rendering:pixelated}

/* masthead */
.masthead{position:fixed;top:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;pointer-events:none;z-index:20}
.masthead>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;background:rgba(251,250,246,.82);border:1px solid var(--rule);border-radius:6px;padding:6px 12px 6px 8px}
.brand .mark{width:32px;height:32px;color:var(--navy);flex:none}
.brand span{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.005em}
.brand i{font-style:normal;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.modes{display:flex;align-items:center;gap:4px;background:rgba(251,250,246,.86);border:1px solid var(--rule);border-radius:6px;padding:4px;box-shadow:0 1px 2px rgba(27,31,39,.05)}
.modes button{border:0;background:none;padding:7px 13px 8px;font-size:14px;color:var(--ink-2);border-radius:4px;transition:color .2s,background .2s}
.modes button:hover{color:var(--ink);background:var(--paper-2)}
.modes button[aria-pressed="true"]{color:var(--paper);background:var(--navy)}
.modes .sep{width:1px;height:20px;background:var(--rule);margin:0 4px}

/* rail */
.rail{position:fixed;left:28px;top:96px;width:392px;max-height:calc(100% - 124px);overflow:auto;z-index:15;background:var(--card);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:24px 26px 18px;scrollbar-width:thin}
.rail.fade>*{animation:railIn .55s var(--ease) both}
@keyframes railIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;color:var(--ink-3);font-size:13px;flex-wrap:wrap}
.kicker .n{font-family:var(--num);font-weight:500;color:var(--gold-t);font-size:14px;letter-spacing:.02em}
.kicker .chap{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--ink-2)}
.rail h2{font-family:var(--serif);font-weight:420;font-size:28px;line-height:1.12;letter-spacing:-.012em;margin:0 0 14px;text-wrap:balance}
.rail h2.cover{font-size:35px;line-height:1.06}
.rail p{font-size:15.5px;line-height:1.55;color:var(--ink-2);margin:0 0 12px;text-wrap:pretty}
.rail p b{color:var(--ink);font-weight:600}
.small{font-size:13px!important;line-height:1.5!important;color:var(--ink-3)!important}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 14px;margin:6px 0 14px;padding:12px 0 2px;border-top:1px solid var(--rule)}
.figs.two{grid-template-columns:repeat(2,1fr)}
.fig b{display:block;font-family:var(--num);font-weight:300;font-size:29px;line-height:1.05;color:var(--navy);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.fig b small{font-size:14px;font-weight:400;margin-left:2px;color:var(--ink-2)}
.fig span{display:block;font-size:12.5px;line-height:1.3;color:var(--ink-3);margin-top:3px}
.eqbox{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);border-radius:4px;padding:10px 12px;margin:4px 0 12px;line-height:1.5;overflow-x:auto;white-space:nowrap}
.eqbox .a{color:var(--navy)} .eqbox .b{color:var(--green)} .eqbox .c{color:var(--gold-t)}
.eqkey{font-size:12.5px;color:var(--ink-3);margin:-4px 0 12px;line-height:1.45}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps button{width:20px;height:22px;border:0;background:none;padding:0;position:relative}
.steps button::after{content:'';position:absolute;left:3px;right:3px;top:10px;height:2px;background:var(--rule);border-radius:1px;transition:background .25s}
.steps button.on::after{background:var(--navy)} .steps button.done::after{background:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:4px;padding:8px 13px 9px;font-size:14px;line-height:1;text-decoration:none;transition:background .2s,border-color .2s}
.btn:hover{background:var(--paper-2);border-color:rgba(27,31,39,.22)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#0B2C7A}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-2);padding-left:6px;padding-right:6px}
.btn svg{width:14px;height:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;padding:2px;background:var(--paper);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px 7px;font-size:13.5px;color:var(--ink-2);border-radius:3px;line-height:1.1}
.seg button:hover{color:var(--ink);background:var(--paper-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg.full{display:flex} .seg.full button{flex:1}
.metrics{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:13px}
.metrics th{text-align:left;font-weight:400;color:var(--ink-3);padding:6px 0;border-top:1px solid var(--rule-2)}
.metrics td{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;padding:6px 0 6px 8px;border-top:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.metrics thead td,.metrics thead th{font-family:var(--serif);font-weight:500;font-size:13.5px;color:var(--ink);border-top:0}
.metrics td.good{color:var(--green);font-weight:600} .metrics td.bad{color:var(--terra);font-weight:600}
.reasons{list-style:none;margin:0 0 12px;padding:0;counter-reset:r}
.reasons li{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:8px 0;border-top:1px solid var(--rule-2);font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.reasons li::before{counter-increment:r;content:counter(r);font-family:var(--num);font-weight:500;color:var(--gold-t)}
.reasons li b{color:var(--ink);font-weight:600}
.section-h{font-family:var(--serif);font-size:17px;font-weight:500;margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-h:first-child{margin-top:0}
.section-h small{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400}
.layers{list-style:none;margin:0;padding:0}
.layers li{border-top:1px solid var(--rule-2)}
.layers li:first-child{border-top:0}
.layers button{display:flex;width:100%;align-items:center;gap:10px;padding:7px 4px;border:0;background:none;text-align:left;font-size:14px;color:var(--ink-2);border-radius:3px}
.layers button:hover{background:var(--paper-2)}
.layers button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.layers button[aria-pressed="true"] .dot{background:var(--navy);border-color:var(--navy)}
.layers .dot{width:13px;height:13px;border-radius:50%;border:1.3px solid var(--ink-3);flex:none}
.layers small{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.ctrl-label{font-size:12.5px;color:var(--ink-3);margin:12px 0 6px;display:flex;justify-content:space-between}
.ctrl-label b{font-family:var(--num);font-weight:500;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--navy)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);margin-top:10px}
.check input{accent-color:var(--navy);width:15px;height:15px}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--rule);font-size:13px}
dl.kv dt{color:var(--ink-3)} dl.kv dd{margin:0;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--ink)}
.callout{font-size:13px;color:var(--ink-2);border-left:2px solid var(--gold);padding:4px 0 4px 12px;margin:12px 0;line-height:1.5}

/* legend, map key, tools */
.legend{position:fixed;right:28px;bottom:26px;width:290px;z-index:14;background:var(--card);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:12px 14px 10px}
.legend h4{margin:0 0 8px;font-family:var(--serif);font-weight:500;font-size:14.5px;line-height:1.25}
.legend h4 small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-3);margin-top:2px}
.legend .ramp{height:10px;border-radius:2px;border:1px solid var(--rule-2)}
.legend .classes{display:grid;grid-template-columns:repeat(10,1fr);height:10px;border:1px solid var(--rule-2);border-radius:2px;overflow:hidden}
.legend .ticks{display:flex;justify-content:space-between;font-family:var(--num);font-size:11.5px;color:var(--ink-2);margin-top:3px}
.legend .src{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.35}
.legend .srckey{display:flex;gap:12px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend .srckey i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mapkey{position:fixed;right:28px;z-index:13;display:flex;align-items:flex-end;gap:14px;pointer-events:none;bottom:calc(26px + var(--legend-h,120px) + 10px)}
.mapkey .bar{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-family:var(--num);font-size:11.5px;color:var(--ink-2);background:rgba(251,250,246,.8);padding:4px 6px;border-radius:3px}
.mapkey .bar i{display:block;height:5px;border:1px solid var(--ink-2);border-top:0;width:80px}
.mapkey .coord{font-family:var(--num);font-size:11.5px;color:var(--ink-2);background:rgba(251,250,246,.8);padding:4px 6px;border-radius:3px;font-variant-numeric:tabular-nums}
.tools{position:fixed;right:28px;top:96px;z-index:14;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.tools button{width:34px;height:34px;border:0;background:none;font-size:18px;color:var(--ink-2);display:grid;place-items:center}
.tools button+button{border-top:1px solid var(--rule-2)}
.tools button:hover{background:var(--paper-2);color:var(--ink)}
.tools svg{width:16px;height:16px}

/* map notes */
.lab{position:relative}
.lab .tag{position:absolute;left:0;bottom:22px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid rgba(27,31,39,.12);border-radius:4px;padding:3px 8px 4px;font-size:12.5px;color:var(--ink);box-shadow:0 1px 2px rgba(27,31,39,.08);line-height:1.25}
.lab .tag.wrap{white-space:normal;width:220px}
.lab .tag small{color:var(--ink-3);margin-left:5px;font-size:12px}
.lab .stem{position:absolute;left:-.5px;bottom:0;width:1px;height:22px;background:rgba(27,31,39,.5)}
.lab .pt{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.lab.place .tag{font-family:var(--serif);font-size:14px;font-weight:500}

/* probe */
.probe{position:fixed;z-index:16;width:256px;background:var(--card);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;color:var(--ink-2)}
.probe h5{margin:0 0 8px;font-family:var(--serif);font-weight:500;font-size:15px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.probe h5 button{border:0;background:none;color:var(--ink-3);font-size:16px;padding:0 2px;line-height:1}
.probe .big{font-family:var(--num);font-weight:300;font-size:28px;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.probe .big small{font-size:13px;color:var(--ink-2);margin-left:4px}
.probe dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0}
.probe dt{color:var(--ink-3)} .probe dd{margin:0;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(27,31,39,.2);z-index:39;animation:fadeIn .3s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);z-index:40;background:var(--card);border-left:1px solid var(--rule);box-shadow:-18px 0 50px -20px rgba(27,31,39,.3);overflow:auto;padding:34px 40px 60px;animation:sheetIn .45s var(--ease) both}
.sheet.wide{width:min(1060px,100vw)}
@keyframes sheetIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.sheet.tut{width:100vw;padding:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.sheet.tut .tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--rule);background:var(--card)}
.sheet.tut .tbar b{font-family:var(--serif);font-weight:460;font-size:18px}
.sheet.tut .tbar span{font-size:13px;color:var(--ink-3);margin-left:10px}
.sheet.tut .close{position:static}
.sheet.tut iframe{flex:1;width:100%;border:0;display:block;background:#ECE9E1}
.watch{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:10px 12px;border:1px solid var(--rule);border-left:3px solid var(--gold);border-radius:4px;background:var(--paper);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.watch:hover{background:var(--paper-2)}
.watch i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.watch b{display:block;font-weight:600;font-size:14.5px}.watch small{font-size:12.5px;color:var(--ink-3)}
.sheet .close{position:absolute;top:22px;right:24px}
.sheet h2{font-family:var(--serif);font-weight:420;font-size:32px;line-height:1.1;margin:8px 0 14px;letter-spacing:-.01em;max-width:24ch}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:30px 0 8px}
.sheet p,.sheet li{font-size:15px;line-height:1.58;color:var(--ink-2);max-width:70ch}
.sheet p{margin:0 0 10px}
.sheet ul{padding-left:18px;margin:6px 0}
.sheet .note{font-size:13px;color:var(--ink-3);border-left:2px solid var(--gold);padding:4px 0 4px 12px;margin:12px 0}
.tw{overflow-x:auto;margin:10px 0;border-top:1px solid var(--rule)}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px}
.tw th,.tw td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule-2);text-align:left;white-space:nowrap;vertical-align:top}
.tw th{font-weight:400;color:var(--ink-3);font-size:12.5px}
.tw th[data-k]{cursor:pointer} .tw th[data-k]:hover{color:var(--ink)}
.tw td.n,.tw th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.tw td.w{white-space:normal;min-width:230px}
.tw tr.ref td{background:var(--paper-2)}
.tw tr.top td{background:var(--gold-l)}
.tag2{font-size:11px;border-radius:999px;padding:1px 7px;border:1px solid var(--rule);color:var(--ink-3);margin-left:6px;white-space:nowrap}
.tag2.ref{border-color:var(--navy);color:var(--navy)} .tag2.win{border-color:var(--gold-t);color:var(--gold-t)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0}
.card{border:1px solid var(--rule);background:var(--paper);border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .k{font-size:12px;color:var(--ink-3)}
.card b{font-family:var(--serif);font-weight:500;font-size:16px;color:var(--ink)}
.card span{font-size:13px;color:var(--ink-2);line-height:1.4}
.card .v{font-family:var(--num);font-weight:300;font-size:24px;color:var(--navy)}
.hb{display:grid;grid-template-columns:minmax(120px,240px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px;margin:3px 0}
.hb .t{height:10px;background:var(--paper-2);border-radius:2px;position:relative;overflow:hidden}
.hb .t i{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:2px}
.hb .t i.b{background:var(--gold)}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb .v{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right}
pre{font-size:12.5px;background:var(--paper);border:1px solid var(--rule-2);border-radius:4px;padding:12px;overflow-x:auto}
dl.terms{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:8px 16px;margin:6px 0}
dl.terms dt{font-weight:600;color:var(--ink);font-size:14.5px} dl.terms dd{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.5}

@media (max-width:900px){
  .masthead{height:auto;padding:10px 10px;flex-direction:column;align-items:flex-start;gap:8px}
  .brand i{display:none}
  .modes{flex-wrap:wrap}
  .rail{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:48%;padding:18px 18px 14px}
  .rail h2{font-size:23px} .rail h2.cover{font-size:27px}
  .legend,.mapkey{display:none}
  .tools{top:auto;bottom:calc(48% + 20px);right:10px}
  .sheet{padding:26px 18px 50px}
  .hb{grid-template-columns:minmax(90px,130px) minmax(0,1fr) 80px}
  dl.terms{grid-template-columns:1fr}
}

    root.querySelector('.sheet').focus();
    return;
  }
  root.innerHTML = `<div class="scrim"></div><section class="sheet ${kind === 'benchmark' ? 'wide' : ''}" aria-label="${kind === 'benchmark' ? 'Benchmark' : 'About the model'}" tabindex="-1">
    <button class="btn quiet close" type="button" aria-label="Close">Close ×</button><div id="sheetbody"></div></section>`;
  root.querySelector('.scrim').onclick = () => setMode(lastMap);
  root.querySelector('.close').onclick = () => setMode(lastMap);
  kind === 'benchmark' ? benchmark() : about();
  root.querySelector('.sheet').focus();
}
function closeSheet() { $('#sheetroot').innerHTML = ''; }

function benchmark() {
  const b = $('#sheetbody'), pt = P.rows;
  b.innerHTML = `<div class="kicker"><span class="n">Benchmark</span><span class="chap">two studies, two outcomes</span></div>
    <h2>Every score next to its comparator</h2>
    <p>Two different questions were tested, so their scores are never ranked together. Report composition uses loss (lower is better). Presence ranking uses average precision (higher is better).</p>
    <h3>Report composition · ${HC.all.configurations} configurations</h3>
    <p>Mean loss on held-out reports, each split weighted equally. Grey rows are the two forest comparators; the matched forest has the same 117 inputs as the leading models.</p>
    <div class="seg" id="bScope">${Object.entries(HC).map(([k, s]) => `<button type="button" data-s="${k}" aria-pressed="${k === scope}">${esc(s.name)}</button>`).join('')}</div>
    <p class="note" id="bScopeNote"></p>
    <div class="tw"><table id="bHico"></table></div>
    <button class="btn" type="button" id="bMore"></button>
    <h3>Presence ranking · 12 frozen models</h3>
    <p>Average precision on the report’s held-out spatial folds (${int(P.cohort.sites)} sites), then the same frozen models on new 2025 surveys. A random ranking scores the share of positives: ${f(P.cohort.presences / P.cohort.sites, 2)} on the folds, ${f(P.neon.positives / P.neon.sites, 2)} for NEON (${P.neon.sites} sites) and ${f(P.ages.positives / P.ages.sites, 2)} for Austria (${P.ages.sites} sites).</p>
    <div>${pt.map(r => `<div class="hb"><span>${esc(r.family)} · ${esc(r.learner)}</span><div><div class="t"><i style="width:${r.ap * 100}%"></i></div><div class="t" style="margin-top:3px"><i class="b" style="width:${(r.neon_ap || 0) * 100}%"></i></div></div><span class="v">${f(r.ap)} · ${f(r.neon_ap)}</span></div>`).join('')}</div>
    <p class="small" style="margin-top:6px">Navy: held-out folds. Gold: NEON 2025 traps. The model that ranks best on the folds is not the one that transfers best to the traps.</p>
    <div class="tw"><table><thead><tr><th>Model</th><th class="n">AP folds</th><th class="n">± sd</th><th class="n">AUC folds</th><th class="n">AP NEON 2025</th><th class="n">AP Austria 2025</th></tr></thead>
      <tbody>${pt.map(r => `<tr><td>${esc(r.family)} · ${esc(r.learner)}</td><td class="n">${f(r.ap)}</td><td class="n">${f(r.ap_sd)}</td><td class="n">${f(r.auc)}</td><td class="n">${f(r.neon_ap)}</td><td class="n">${f(r.ages_ap)}</td></tr>`).join('')}</tbody></table></div>
    <h3>Other studies in the record</h3>
    <div class="cards">${SITE.registry.map(r => `<div class="card"><span class="k">${esc(r.title)}</span><b>${esc(r.winner)}</b><span class="v">${f(r.score)}</span>
      <span>${esc(r.metric)} · baseline ${f(r.baselineScore)} (${esc(r.baseline)}) · ${r.gain ? f(Math.abs(r.gain), 2) + '% ' + (r.gain > 0 ? 'better' : 'worse') : 'no gain'}</span></div>`).join('')}</div>
    <h3>Map rebuild checks</h3>
    <p>Rebuilt Environment 41 inputs against the original values at ${int(SITE.rebuild.calibration_cells)} cells that have both. The 12 lowest of 41 are shown, on an axis from r = 0.95 to 1.</p>
    <div>${[...SITE.rebuild.features].sort((a, b) => a.pearson - b.pearson).slice(0, 12).map(r => `<div class="hb"><span>${esc(r.feature.replace(/_/g, ' '))}</span><div class="t"><i style="width:${Math.max(0, (r.pearson - .95) / .05) * 100}%"></i></div><span class="v">${f(r.pearson)}</span></div>`).join('')}</div>
    <div class="tw"><table><thead><tr><th>Model</th><th class="n">Cells</th><th class="n">r vs original</th><th class="n">Spearman</th><th class="n">Same model, original inputs</th></tr></thead>
      <tbody>${SITE.rebuild.scores.map(r => `<tr><td>${esc(r.model.replace('Environment_AlphaEarth105', 'Fusion 105').replace('Environment41', 'Environment 41').replace('__', ' · '))}</td><td class="n">${int(r.n)}</td><td class="n">${f(r.pearson_vs_orig_surface)}</td><td class="n">${f(r.spearman_vs_orig_surface)}</td><td class="n">${f(r.pearson_orig_features_vs_surface)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">The last column scores the original inputs with the refit model. It is about as far from the original surface as the rebuilt inputs are, so most of the gap comes from refitting, not from the new data.</p>`;
  b.querySelector('#bScope').onclick = e => { const x = e.target.closest('button'); if (!x) return; scope = x.dataset.s; b.querySelectorAll('#bScope button').forEach(y => y.setAttribute('aria-pressed', y === x)); hicoTable(); };
  hicoTable();
}
function hicoTable() {
  const s = HC[scope];
  $('#bScopeNote').textContent = `${s.description}. ${s.configurations} configurations have a score in every split.`;
  let rows = [...s.rows].sort((a, b) => sortDir * ((a[sortK] ?? 1e9) - (b[sortK] ?? 1e9)));
  if (!showAll) rows = rows.filter((r, i) => i < 12 || r.ref105 || r.ref117);
  const th = (k, t, n) => `<th class="${n ? 'n' : ''}" ${k ? `data-k="${k}"` : ''}>${t}${sortK === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  $('#bHico').innerHTML = `<thead><tr>${th('rank', 'Rank', 1)}${th('', 'Configuration')}${th('loss', 'Loss', 1)}${th('vs117', 'vs matched forest', 1)}${th('wins117', 'Splits won', 1)}${th('auc', 'AUC', 1)}${th('ece', 'Calibration error', 1)}</tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.ref105 || r.ref117 ? 'ref' : r.rank === 1 ? 'top' : ''}"><td class="n">${r.rank}</td><td class="w">${esc(r.label)}${r.ref117 ? '<span class="tag2 ref">matched forest</span>' : ''}${r.ref105 ? '<span class="tag2 ref">105-input forest</span>' : ''}${r.rank === 1 ? '<span class="tag2 win">lowest loss</span>' : ''}</td>
      <td class="n">${f(r.loss, 4)}</td><td class="n">${r.vs117 == null ? '–' : lossTxt(r.vs117)}</td><td class="n">${r.wins117 == null ? '–' : r.wins117 + ' / ' + s.splits}</td><td class="n">${f(r.auc)}</td><td class="n">${f(r.ece, 4)}</td></tr>`).join('')}</tbody>`;
  $('#bHico thead').onclick = e => { const t = e.target.closest('th[data-k]'); if (!t) return; const k = t.dataset.k; sortDir = sortK === k ? -sortDir : (['auc', 'vs117', 'wins117'].includes(k) ? -1 : 1); sortK = k; hicoTable(); };
  const m = $('#bMore'); m.textContent = showAll ? 'Show the top 12 and comparators' : `Show all ${s.configurations}`; m.onclick = () => { showAll = !showAll; hicoTable(); };
}

function about() {
  const ee = SITE.rebuild.ee_cost;
  $('#sheetbody').innerHTML = `<div class="kicker"><span class="n">About</span><span class="chap">the model and the maps</span></div>
    <h2>How HiCo-Fuse 2 and the atlas were built</h2>
    <p>HiCo-Fuse 2 is a hierarchical, coherent fusion model. A random forest describes each 0.05° cell. A small regional head adds which species have arrived. A coherence rule keeps the cells of each region adding up to it, and a trust weight falls back to the forest in unfamiliar environments.</p>
    <div class="note">The global HiCo-Fuse 2 maps shown here are from the released version (dual shrinkage). The environmental-shrinkage variant scored ${f(TOP.vs117 - HC.all.rows.find(r => r.id === 'HF2-shrink2+pool4').vs117, 2)} percentage points better on the benchmark, but its global maps have not been regenerated yet.</div>
    <h3>Measures</h3>
    <dl class="terms"><dt>Loss</dt><dd>Negative log likelihood: the penalty for giving little probability to the group actually reported. Lower is better.</dd>
      <dt>AUC</dt><dd>The chance that a random positive scores above a random negative. 0.5 is chance, 1 is perfect.</dd>
      <dt>Average precision</dt><dd>How well positives rank near the top. Compare it with the share of positives, which is what random guessing scores.</dd>
      <dt>Calibration error</dt><dd>The average gap between predicted probability and observed frequency.</dd>
      <dt>Held-out split</dt><dd>Data hidden from fitting. Nearby blocks, unfamiliar environments, climate zones and whole continents test ever more distant transfer.</dd></dl>
    <h3>The presence maps</h3>
    <p>The 0.05° presence maps score every cell with frozen models fitted on ${int(P.cohort.sites)} sites from 2024 (${int(P.cohort.presences)} presences, ${int(P.cohort.background)} background). Each uses the original project surface where it was recovered (north of about 6–14° S) and the validated rebuild elsewhere, including gaps in the Sahara, Arabia and high mountains. Rebuilt inputs match the originals at r 0.96–1.00. Night surface temperature reads about 1.3 °C warm.</p>
    <p>A full Earth Engine rebuild would have needed about ${int(ee.projected_eecu_hours)} compute-hours, against a free quota of ${ee.community_quota_hours} a month. So the circle averages were computed locally from public downloads, with Earth Engine used only to fetch raw pixels for four layers.</p>
    <div class="tw"><table><thead><tr><th>Input</th><th>Source</th><th>Route</th></tr></thead><tbody>${SITE.rebuild.sources.map(s => `<tr><td>${esc(s.feature)}</td><td class="w">${esc(s.source)}</td><td>${s.route === 'public' ? 'Public download' : s.route === 'pixels' ? 'Earth Engine pixels' : 'Local file'}</td></tr>`).join('')}</tbody></table></div>
    <h3>Limits</h3>
    <ul><li>Reports come from volunteers, so coverage follows people; the model learns the mix of reports to cancel effort, which does not remove every bias.</li>
      <li>One 2024 environmental snapshot is paired with reports from 2022–2025.</li>
      <li>Both 2025 surveys have already been inspected, so neither is a fresh test for choosing a model now.</li>
      <li>These are suitability rankings. They are not occurrence probabilities, abundance or disease risk.</li></ul>
    <h3>Sources and reproduction</h3>
    <p>Report-composition results: <a href="https://missa7481.github.io/habitat-framework-studio/" target="_blank" rel="noopener">Habitat Framework Studio</a> at commit <code>${SITE.studio_commit.slice(0, 7)}</code>, whose build script regenerates the same 271 rows exactly. HiCo-Fuse 2 maps and model details: <a href="https://missa7481.github.io/habitat-observatory/" target="_blank" rel="noopener">Habitat Observatory</a>. Presence maps and checks: this workspace’s handoff scripts. Relief: Natural Earth (public domain). Aggregates only; no site locations are shown.</p>
    <pre>.venv/bin/python scripts/env41_map.py data/processed/env41_local data/processed/worldclim_env41_local.csv --water w_frac_samp
.venv/bin/python site_studio/tools/build_layers.py
.venv/bin/python site_studio/tools/build_data.py
.venv/bin/python site_studio/tools/assemble.py</pre>`;
}

/* ------------------------------------------------------------------ modes */
let mode = 'story', lastMap = 'story';
const SHEETS = ['benchmark', 'tutorial', 'about'];
function setMode(m) {
  if (!['story', 'explore', 'benchmark', 'tutorial', 'about'].includes(m)) m = 'story';
  mode = m;
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  if (location.hash.slice(1) !== m) history.replaceState(null, '', '#' + m);
  if (SHEETS.includes(m)) { openSheet(m); return; }
  closeSheet(); lastMap = m;
  if (m === 'story') { go(step); } else { setNotes(); renderExplore(); draw(); }
}
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
addEventListener('hashchange', () => setMode(location.hash.slice(1)));
addEventListener('keydown', e => {
  if (e.key === 'Escape' && SHEETS.includes(mode)) setMode(lastMap);
  if (mode !== 'story' || e.target.closest('input,select,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(step + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(step - 1); }
});

initMap();
const h0 = location.hash.slice(1);
if (SHEETS.includes(h0)) { go(0); setMode(h0); } else setMode(h0 || 'story');

</script>
